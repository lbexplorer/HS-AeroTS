paths:
  feature_dir: data/processed/p2/features_original
  group_dictionary: reports/p2/group_dictionary.csv
  annotations: reports/p1/annotations.csv
  report_dir: reports/p7

model:
  n_estimators: 1600
  learning_rate: 0.025
  num_leaves: 64
  min_child_samples: 80
  subsample: 0.90
  colsample_bytree: 0.75
  reg_alpha: 0.20
  reg_lambda: 8.0
  early_stopping_rounds: 80
  class_weight: balanced

experiment:
  seeds: [0, 1, 2, 3, 4]
  n_jobs: -1
  top_fraction: 0.10
  normal_fpr: 0.05
