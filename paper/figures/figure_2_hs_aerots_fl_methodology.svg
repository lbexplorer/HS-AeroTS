<text class="ttl" x="55" y="60">HS-AeroTS-FL: From Flight Telemetry to Architecture-Aware Diagnostic Evidence</text>
<text class="sub" x="55" y="89">A traceable hierarchy from real PX4 flight logs to static, version-aware software-module suspects</text>
<path class="line" d="M425 420H467"/><path class="line" d="M875 420H917"/><path class="line" d="M1325 420H1367"/>

<!-- 1 TELEMETRY -->
<g id="telemetry" filter="url(#s)"><rect x="55" y="125" width="370" height="575" rx="16" fill="#F6FAFD" stroke="#24557A" stroke-width="2"/><path d="M71 125H409Q425 125 425 141V208H55V141Q55 125 71 125Z" fill="#24557A"/><circle cx="86" cy="166" r="20" fill="#fff" opacity=".18"/><text class="n" x="80" y="173">1</text><text class="h" x="116" y="159">TELEMETRY &amp;</text><text class="h" x="116" y="184">FEATURE REPRESENTATION</text>
<rect x="302" y="219" width="103" height="25" rx="12" fill="#D9EEF6"/><text class="bg" x="316" y="236" fill="#24557A">RUNTIME INPUT</text>
<rect x="78" y="263" width="324" height="68" rx="10" fill="#fff" stroke="#B9D1E2"/><text class="bb" x="98" y="290">UAV-SEAD PX4 ULog</text><text class="b" x="98" y="314">1,389 usable real-flight logs</text>
<path class="line" d="M240 337V360"/><rect x="78" y="366" width="324" height="66" rx="10" fill="#fff" stroke="#B9D1E2"/><text class="bb" x="98" y="393">87 telemetry channels</text><text class="b" x="98" y="417">Aligned on a common 10 Hz grid</text>
<path class="line" d="M240 438V461"/><rect x="78" y="467" width="324" height="81" rx="10" fill="#fff" stroke="#B9D1E2"/><text class="bb" x="98" y="494">Overlapping windows</text><text class="b" x="98" y="518">96 samples • stride 8 • horizon 12</text><text class="sm" x="98" y="539">Training-only standardization</text>
<path class="line" d="M240 554V577"/><rect x="78" y="583" width="324" height="88" rx="10" fill="#EAF4F9" stroke="#7CA8C5"/><text class="bb" x="98" y="610">18 descriptors × 87 channels</text><text class="b" x="98" y="634">1,566 temporal-statistical features</text><text class="sm" x="98" y="657">descriptor → channel → topic → subsystem</text></g>

<!-- 2 DIAGNOSIS -->
<g id="diagnosis" filter="url(#s)"><rect x="505" y="125" width="370" height="575" rx="16" fill="#F4FBFA" stroke="#118C8B" stroke-width="2"/><path d="M521 125H859Q875 125 875 141V208H505V141Q505 125 521 125Z" fill="#0B7776"/><circle cx="536" cy="166" r="20" fill="#fff" opacity=".18"/><text class="n" x="530" y="173">2</text><text class="h" x="566" y="159">HIERARCHICAL</text><text class="h" x="566" y="184">RUNTIME DIAGNOSIS</text>
<rect x="660" y="219" width="87" height="25" rx="12" fill="#D7F0ED"/><text class="bg" x="677" y="236" fill="#0B7776">RUNTIME</text><rect x="753" y="219" width="102" height="25" rx="12" fill="#FFF0CF"/><text class="bg" x="766" y="236" fill="#8A5200">CONDITIONAL</text>
<rect x="528" y="269" width="324" height="96" rx="11" fill="#fff" stroke="#8ECAC5"/><text class="sh" x="548" y="297">STAGE 1 · Binary LightGBM</text><text class="b" x="548" y="322">Class-balanced anomaly detector</text><text class="b" x="548" y="346">Score → frozen validation threshold</text>
<path d="M690 371V395" stroke="#118C8B" stroke-width="3" marker-end="url(#t)"/><polygon points="690 399 738 441 690 483 642 441" fill="#E0F3F0" stroke="#118C8B" stroke-width="2"/><text class="bb" x="655" y="438">score ≥</text><text class="bb" x="657" y="458">threshold?</text>
<path d="M642 441H570V496" stroke="#7B8794" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text class="sm" x="588" y="428">No</text><rect x="528" y="503" width="110" height="48" rx="24" fill="#E9EEF2" stroke="#A8B5C1"/><text class="bb" x="559" y="533">Normal</text>
<path d="M738 441H821V496" stroke="#118C8B" stroke-width="2.5" fill="none" marker-end="url(#t)"/><text class="sm" x="772" y="428">Yes</text><rect x="655" y="503" width="197" height="166" rx="11" fill="#E7F6F4" stroke="#62B8B0"/><text class="sh" x="674" y="530">STAGE 2</text><text class="bb" x="674" y="553">Four-class LightGBM</text><text class="sm" x="674" y="579">External Position</text><text class="sm" x="674" y="600">Global Position</text><text class="sm" x="674" y="621">Altitude</text><text class="sm" x="674" y="642">Mechanical/Electrical</text></g>

<!-- 3 EVIDENCE -->
<g id="evidence" filter="url(#s)"><rect x="955" y="125" width="370" height="575" rx="16" fill="#FAF8FD" stroke="#6D5A9A" stroke-width="2"/><path d="M971 125H1309Q1325 125 1325 141V208H955V141Q955 125 971 125Z" fill="#5D4B88"/><circle cx="986" cy="166" r="20" fill="#fff" opacity=".18"/><text class="n" x="980" y="173">3</text><text class="h" x="1016" y="159">EXPLAINABLE</text><text class="h" x="1016" y="184">EVIDENCE HIERARCHY</text>
<rect x="1200" y="219" width="105" height="25" rx="12" fill="#EAE4F4"/><text class="bg" x="1213" y="236" fill="#5D4B88">EXPLAINABLE</text>
<rect x="978" y="269" width="324" height="72" rx="10" fill="#fff" stroke="#C3B8D7"/><text class="bb" x="998" y="297">Predicted-class TreeSHAP</text><text class="b" x="998" y="321">Non-negative evidence magnitude |φⱼ|</text>
<path class="line" d="M1140 347V370"/><rect x="978" y="376" width="324" height="126" rx="10" fill="#F0ECF7" stroke="#A99AC4"/><text class="sh" x="998" y="403">Evidence aggregation</text>
<rect x="990" y="422" width="52" height="31" rx="6" fill="#fff" stroke="#9B89BB"/><text x="997" y="443" style="font:400 12px Arial,sans-serif;fill:#40566C">Feature</text><path class="line" d="M1044 438H1063"/><rect x="1068" y="422" width="57" height="31" rx="6" fill="#fff" stroke="#9B89BB"/><text x="1075" y="443" style="font:400 12px Arial,sans-serif;fill:#40566C">Channel</text><path class="line" d="M1127 438H1146"/><rect x="1151" y="422" width="45" height="31" rx="6" fill="#fff" stroke="#9B89BB"/><text x="1158" y="443" style="font:400 12px Arial,sans-serif;fill:#40566C">Topic</text><path class="line" d="M1198 438H1217"/><rect x="1222" y="422" width="70" height="31" rx="6" fill="#fff" stroke="#9B89BB"/><text x="1228" y="443" style="font:400 11px Arial,sans-serif;fill:#40566C">Subsystem</text><text class="sm" x="998" y="482">Conservation checked at every level</text>
<path class="line" d="M1140 508V531"/><rect x="978" y="537" width="324" height="77" rx="10" fill="#fff" stroke="#C3B8D7"/><text class="bb" x="998" y="564">Evidence quality tests</text><text class="b" x="998" y="589">Top-k masking • Consistency@K • Hit@K</text><rect x="978" y="627" width="324" height="42" rx="8" fill="#FFF4DC" stroke="#E8B85A"/><text class="co" x="1014" y="653">DIAGNOSTIC EVIDENCE — NOT CAUSAL PROOF</text></g>

<!-- 4 PX4 RANKING -->
<g id="ranking" filter="url(#s)"><rect x="1405" y="125" width="340" height="575" rx="16" fill="#FFFAF2" stroke="#C57A12" stroke-width="2"/><path d="M1421 125H1729Q1745 125 1745 141V208H1405V141Q1405 125 1421 125Z" fill="#A76009"/><circle cx="1436" cy="166" r="20" fill="#fff" opacity=".18"/><text class="n" x="1430" y="173">4</text><text x="1466" y="159" style="font:700 17px Arial,sans-serif;fill:#fff">PX4 ARCHITECTURE-AWARE</text><text class="h" x="1466" y="184">SUSPECT RANKING</text>
<rect x="1551" y="219" width="174" height="25" rx="12" fill="#FFF0CF"/><text x="1560" y="236" style="font:700 10px Arial,sans-serif;fill:#8A5200;letter-spacing:.3px">STATIC ARCHITECTURE-AWARE</text>
<rect x="1428" y="269" width="294" height="67" rx="10" fill="#fff" stroke="#E5C38E"/><text class="bb" x="1448" y="296">Firmware commit provenance</text><text class="b" x="1448" y="319">Version-matched PX4 source tree</text><path class="line" d="M1575 342V365"/>
<rect x="1428" y="371" width="294" height="76" rx="10" fill="#fff" stroke="#E5C38E"/><text class="bb" x="1448" y="398">Static uORB source scan</text><text class="b" x="1448" y="423">Publisher / subscriber topic edges</text><path class="line" d="M1575 453V476"/>
<rect x="1428" y="482" width="294" height="101" rx="10" fill="#FFF4DC" stroke="#E1AE55"/><text class="bb" x="1448" y="510">Allocate topic evidence</text><text class="b" x="1448" y="535">across connected PX4 modules</text><text class="sm" x="1448" y="562">Producer | Consumer | Bidirectional</text><path class="line" d="M1575 589V612"/>
<rect x="1428" y="618" width="294" height="50" rx="25" fill="#A76009"/><text x="1450" y="650" style="font:700 17px Arial,sans-serif;fill:#fff">RANKED MODULE SUSPECTS</text><text x="1438" y="690" style="font:700 10px Arial,sans-serif;fill:#8A5200">STATIC • VERSION-DEPENDENT • NOT ROOT CAUSE</text></g>

<!-- TRACEABILITY -->
<g id="traceability"><rect x="55" y="742" width="1690" height="72" rx="13" fill="#EAF2F7" stroke="#9DB3C3"/><rect x="55" y="742" width="240" height="72" rx="13" fill="#17324D"/><rect x="280" y="742" width="15" height="72" fill="#17324D"/><text x="76" y="773" style="font:700 17px Arial,sans-serif;fill:#fff">TRACEABILITY &amp;</text><text x="76" y="797" style="font:700 17px Arial,sans-serif;fill:#fff">PROTOCOL CONTROL</text>
