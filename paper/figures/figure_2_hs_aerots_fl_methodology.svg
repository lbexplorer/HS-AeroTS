<g id="outputs"><text class="sh" x="55" y="859">OUTPUT CHAIN</text><rect x="188" y="832" width="250" height="48" rx="24" fill="#E7F6F4" stroke="#118C8B"/><text class="out" x="231" y="862">Runtime anomaly status</text><path d="M443 856H488" stroke="#118C8B" stroke-width="3" marker-end="url(#t)"/><rect x="495" y="832" width="250" height="48" rx="24" fill="#E7F6F4" stroke="#118C8B"/><text class="out" x="534" y="862">Conditional fault domain</text><path d="M750 856H795" stroke="#118C8B" stroke-width="3" marker-end="url(#t)"/><rect x="802" y="832" width="250" height="48" rx="24" fill="#F0ECF7" stroke="#6D5A9A"/><text class="out" x="853" y="862">Subsystem evidence</text><path d="M1057 856H1102" stroke="#118C8B" stroke-width="3" marker-end="url(#t)"/><rect x="1109" y="832" width="320" height="48" rx="24" fill="#FFF4DC" stroke="#C57A12"/><text class="out" x="1154" y="862">PX4 software-module suspects</text></g>
